<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none" role="img" aria-label="Webstix Logo">
  <defs>
    <linearGradient id="webstix-primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="webstix-facet-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- W Monogram Icon (authoritative geometric ribbon mark) -->
  <g transform="translate(6, 6)" filter="url(#subtle-glow)">
    <!-- Outer left chevron -->
    <path d="M4 8 L14 46 L24 24 L14 8 Z" fill="url(#webstix-primary-grad)" />
    <!-- Center left fold -->
    <path d="M14 46 L26 46 L30 32 L24 24 Z" fill="url(#webstix-facet-grad)" opacity="0.9" />
    <!-- Center vertex -->
    <path d="M26 46 L32 20 L38 46 Z" fill="url(#webstix-primary-grad)" />
    <!-- Center right fold -->
    <path d="M38 46 L50 46 L40 24 L34 32 Z" fill="url(#webstix-facet-grad)" opacity="0.9" />
    <!-- Outer right chevron -->
    <path d="M60 8 L50 46 L40 24 L50 8 Z" fill="url(#webstix-primary-grad)" />
    <!-- Inner glowing facet bridges -->
    <polygon points="14,8 24,24 32,20 22,6" fill="#60A5FA" opacity="0.3" />
    <polygon points="50,8 40,24 32,20 42,6" fill="#C084FC" opacity="0.3" />
  </g>

  <!-- Wordmark "Webstix" -->
  <g transform="translate(80, 42)">
    <text font-family="'Manrope', 'Inter', system-ui, sans-serif" font-weight="800" font-size="32" letter-spacing="-0.03em">
      <tspan fill="#F8FAFC">Web</tspan><tspan fill="url(#webstix-primary-grad)">stix</tspan>
    </text>
  </g>
</svg>
